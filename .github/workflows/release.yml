# Publishes Serena Theme when a tag vX.Y.Z is pushed:
#   1. checks that the tag matches package.json and that CHANGELOG.md has an entry for that version
#   2. regenerates themes/ and icons/ and fails if the committed files are stale or incomplete,
#      then runs the checks of scripts/check.mjs (contrast, roles, icons, README numbers)
#   3. packages ONE .vsix and fails if it holds any file VS Code does not load (the same step as in
#      validate.yml, repeated here because a tag is released whether or not Validate passed)
#   4. publishes that same .vsix to the Visual Studio Marketplace and to Open VSX,
#      each one only if it is configured below (otherwise, upload the .vsix by hand)
#   5. attaches the .vsix to a GitHub release
#
# Open VSX without a stored secret (Settings > Environments > release > Environment variables):
#   OVSX_TRUSTED_PUBLISHING  set to "true" once this workflow is registered as a trusted publisher at
#                            https://open-vsx.org/user-settings/trusted-publishers (owner joaooliveira10,
#                            repository serena-theme, workflow release.yml, environment release).
#   What the registration trusts: any run of a file named release.yml in this repository, from any
#   branch or tag, in a job that uses the environment "release". So whoever can push here, and any code
#   that runs inside this job, can publish. To revoke it, delete the registration on open-vsx.org;
#   removing the variable only skips the step below.
#
# Optional secrets (Settings > Environments > release > Environment secrets):
#   VSCE_PAT  Azure DevOps PAT, Organization "All accessible organizations", scope Marketplace > Manage.
#             Global PATs stop working on 2026-12-01: switch to the Entra ID block below before that.
#   OVSX_PAT  Open VSX access token (https://open-vsx.org/user-settings/tokens). Only used while
#             OVSX_TRUSTED_PUBLISHING is not "true".
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Actions are pinned to full commit SHAs (a tag can be moved, a SHA cannot). Dependabot keeps them up to date.
# Read-only by default: a job gets write access only where it says so.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # short-lived OIDC token for Open VSX trusted publishing (and the Entra ID option below)
    # vsce and ovsx are pinned, but npx resolves their dependencies (about 350 packages) at run time,
    # in a job that can publish. So: no install scripts, and nothing published in the last 7 days.
    # npm normally just picks an older version that still fits. It fails with ETARGET only when no
    # version old enough fits, for example right after raising a vsce or ovsx pin to a release that is
    # less than 7 days old. validate.yml runs the same installs, so it usually shows that first.
    # If it happens here, wait and re-run the job.
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_MIN_RELEASE_AGE: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # CHANGELOG.md is shown on both stores: it needs "## X.Y.Z" and no leftover "## Unreleased" / "## Não lançado".
      - name: CHANGELOG must have an entry for this version
        run: |
          v="$(node -p "require('./package.json').version")"
          if ! grep -qxF "## $v" CHANGELOG.md || grep -Eq '^## (Unreleased|Não lançado)' CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs '## $v' and no '## Unreleased'. Fix it in a new commit, then move the tag to that commit (re-running this run will not help)."
            exit 1
          fi

      # "git status" also reports files the build created or deleted; "git diff" only looks at tracked files.
      - name: Generated files must be up to date
        run: |
          node build.mjs
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Run 'node build.mjs' and commit every generated file, including new ones. Then move the tag to that commit (re-running this run will not help)."
            exit 1
          fi

      - name: Checks the build does not make (contrast, roles, icons, README numbers)
        run: node scripts/check.mjs

      # SOURCE_DATE_EPOCH makes vsce stamp the files with the commit time instead of the current time, so on
      # these runners (Linux, UTC) the same commit gives the same .vsix. The zip also stores the local time
      # and the file permissions: a build on Windows or in another time zone has another hash. The hash
      # printed here is the one of the file that is published below and attached to the GitHub release.
      - name: Package
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out serena-theme.vsix
          sha256sum serena-theme.vsix

      # .vscodeignore is a whitelist; this looks at the result. A new kind of file that should ship
      # needs a line in .vscodeignore and in the list below.
      - name: The package holds only what VS Code loads
        run: |
          allowed='^(\[Content_Types\]\.xml|extension\.vsixmanifest|extension/(package\.json|readme\.md|changelog\.md|LICENSE\.txt|THIRD_PARTY_NOTICES\.md|images/icon\.png|themes/serena-[a-z0-9-]+-color-theme\.json|icons/serena-icons(-minimal)?\.json|icons/(logos/)?(dark|light|hc)/[a-z0-9][a-z0-9_-]*\.svg))$'
          files="$(unzip -Z1 serena-theme.vsix)"
          extra="$(printf '%s\n' "$files" | grep -vE "$allowed" || true)"
          if [ -n "$extra" ]; then
            printf '%s\n' "$extra"
            echo "::error::The package has files that VS Code does not load (listed above)."
            exit 1
          fi
          echo "$(printf '%s\n' "$files" | wc -l) files in the package, all of them expected."

      # Secrets cannot be read in `if:`, so this step only reports which ones exist.
      - name: Check which stores have credentials
        id: creds
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "vsce=$([ -n "$VSCE_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ovsx=$([ -n "$OVSX_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Option A (works until 2026-12-01): PAT stored as a secret.
      - name: Publish to Visual Studio Marketplace (PAT)
        if: steps.creds.outputs.vsce == 'true'
        run: npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate --packagePath serena-theme.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Option B (no stored secret; required after 2026-12-01): Microsoft Entra ID.
      # Needs an Entra app registration or user-assigned managed identity with a federated
      # credential for this repo (issuer https://token.actions.githubusercontent.com, audience
      # api://AzureADTokenExchange), added as a Contributor member of the publisher. Subject: the
      # sub_claim_prefix shown by "gh api repos/joaooliveira10/serena-theme/actions/oidc/customization/sub"
      # followed by ":environment:release". This repository uses GitHub's immutable subject format, so
      # today that is repo:joaooliveira10@45423627/serena-theme@1400565582:environment:release.
      # Delete Option A and uncomment:
      # - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      #   with:
      #     client-id: ${{ vars.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ vars.AZURE_TENANT_ID }}
      #     allow-no-subscriptions: true
      # - name: Publish to Visual Studio Marketplace (Entra ID)
      #   run: npx --yes @vscode/vsce@3.9.2 publish --azure-credential --packagePath serena-theme.vsix

      # Open VSX, option A (no stored secret): trusted publishing. The job proves its identity with an
      # OIDC token and Open VSX answers with a token that lasts minutes and can only publish this extension.
      - name: Publish to Open VSX (trusted publishing)
        if: vars.OVSX_TRUSTED_PUBLISHING == 'true'
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --skip-duplicate serena-theme.vsix

      # Open VSX, option B: access token stored as a secret.
      - name: Publish to Open VSX (access token)
        if: vars.OVSX_TRUSTED_PUBLISHING != 'true' && steps.creds.outputs.ovsx == 'true'
        run: npx --yes ovsx@1.2.0 publish --skip-duplicate serena-theme.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: serena-theme.vsix
          generate_release_notes: true
