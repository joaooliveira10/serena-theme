# Checks every push and pull request:
#   1. themes/, icons/ and the README "no italics" block were regenerated from src/ (node build.mjs)
#   2. the extension still packages
#   3. the release tools (vsce, ovsx) still install under the same npm settings release.yml uses
name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Same npm settings as release.yml, so a dependency that cannot be resolved shows up here first.
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_MIN_RELEASE_AGE: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Generated files must be up to date
        run: |
          node build.mjs
          git diff --exit-code || (echo "::error::Run 'node build.mjs' and commit the generated files." && exit 1)

      - name: Package
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out serena-theme.vsix

      # Installs the pinned Open VSX CLI and runs it without publishing anything.
      - name: Open VSX CLI installs
        run: npx --yes ovsx@1.2.0 --version
